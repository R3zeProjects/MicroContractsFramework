name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=g++
          - name: Linux Clang
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=clang++
          - name: Windows MSVC
            os: windows-latest
            cmake_args: ''
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  installed-package:
    name: Installed package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure and install
        run: |
          cmake -S . -B build -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/install"
      - name: Consume installed package
        run: |
          cmake -S tests/package_consumer -B consumer \
            -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build consumer --parallel
          ./consumer/vosp_contracts_package_consumer
