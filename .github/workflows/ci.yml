name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=g++
            cxxflags: ''
          - name: Linux Clang
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=clang++
            cxxflags: -stdlib=libc++ -fexperimental-library
          - name: Windows MSVC
            os: windows-latest
            cmake_args: ''
            cxxflags: ''
    env:
      CXXFLAGS: ${{ matrix.cxxflags }}
      LDFLAGS: ${{ matrix.cxxflags }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Clang standard library
        if: matrix.name == 'Linux Clang'
        run: >-
          .github/scripts/install-apt-packages.sh
          clang libc++-dev libc++abi-dev
      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  installed-package:
    name: Installed package
    runs-on: ubuntu-latest
    env:
      CXXFLAGS: -stdlib=libc++ -fexperimental-library
      LDFLAGS: -stdlib=libc++ -fexperimental-library
    steps:
      - uses: actions/checkout@v5
      - name: Install Clang standard library
        run: >-
          .github/scripts/install-apt-packages.sh
          clang libc++-dev libc++abi-dev
      - name: Configure and install
        run: |
          cmake -S . -B build -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/install"
          grep -F 'set(PACKAGE_VERSION "0.9.0")' \
            install/lib/cmake/vosp_contracts/vosp_contractsConfigVersion.cmake
      - name: Consume installed package
        run: |
          cmake -S tests/package_consumer -B consumer \
            -DCMAKE_PREFIX_PATH="$PWD/install" \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build consumer --parallel
          ./consumer/vosp_contracts_package_consumer

  ecosystem-packages:
    name: Ecosystem packages (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            compiler: g++
            cxxflags: ''
          - name: Linux Clang
            os: ubuntu-latest
            compiler: clang++
            cxxflags: -stdlib=libc++ -fexperimental-library
          - name: Windows MSVC
            os: windows-latest
            compiler: ''
            cxxflags: ''
    env:
      CXXFLAGS: ${{ matrix.cxxflags }}
      LDFLAGS: ${{ matrix.cxxflags }}
    steps:
      - name: Checkout MCF under test
        uses: actions/checkout@v5
      - name: Install Clang standard library
        if: matrix.name == 'Linux Clang'
        run: >-
          .github/scripts/install-apt-packages.sh
          clang libc++-dev libc++abi-dev
      - name: Checkout MEF
        uses: actions/checkout@v5
        with:
          repository: R3zeProjects/MicroErrorFramework
          path: .ecosystem/MicroErrorFramework
      - name: Checkout MProtocolF
        uses: actions/checkout@v5
        with:
          repository: R3zeProjects/MicroProtocolFramework
          path: .ecosystem/MicroProtocolFramework
      - name: Checkout MPF
        uses: actions/checkout@v5
        with:
          repository: R3zeProjects/MicroPersistenceFramework
          path: .ecosystem/MicroPersistenceFramework
      - name: Checkout MTF
        uses: actions/checkout@v5
        with:
          repository: R3zeProjects/MicroTelemetryFramework
          path: .ecosystem/MicroTelemetryFramework
      - name: Checkout MConfigF
        uses: actions/checkout@v5
        with:
          repository: R3zeProjects/MicroConfigurationFramework
          path: .ecosystem/MicroConfigurationFramework
      - name: Checkout MRF
        uses: actions/checkout@v5
        with:
          repository: R3zeProjects/MicroResilienceFramework
          path: .ecosystem/MicroResilienceFramework
      - name: Checkout MWF
        uses: actions/checkout@v5
        with:
          repository: R3zeProjects/MicroWorkflowFramework
          path: .ecosystem/MicroWorkflowFramework
      - name: Checkout MSF
        uses: actions/checkout@v5
        with:
          repository: R3zeProjects/MicroServiceFramework
          path: .ecosystem/MicroServiceFramework
      - name: Verify dependency direction
        shell: pwsh
        run: >-
          .github/scripts/test-ecosystem-boundaries.ps1
          -ContractsSource '${{ github.workspace }}'
          -FrameworksRoot '${{ github.workspace }}/.ecosystem'
      - name: Install and consume all packages
        shell: pwsh
        run: >-
          .github/scripts/test-ecosystem-packages.ps1
          -ContractsSource '${{ github.workspace }}'
          -FrameworksRoot '${{ github.workspace }}/.ecosystem'
          -BuildRoot '${{ runner.temp }}/vosp-ecosystem'
          -CxxCompiler '${{ matrix.compiler }}'

  static-analysis:
    name: Linux clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CXXFLAGS: -stdlib=libc++ -fexperimental-library
      LDFLAGS: -stdlib=libc++ -fexperimental-library
    steps:
      - uses: actions/checkout@v5
      - name: Install analysis toolchain
        run: >-
          .github/scripts/install-apt-packages.sh
          clang clang-tidy ninja-build libc++-dev libc++abi-dev
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_CLANG_TIDY=clang-tidy
          -DBUILD_TESTING=ON
      - name: Analyze contracts and mock implementations
        run: cmake --build build --parallel 2

  translation-parity:
    if: github.ref == 'refs/heads/main-ru'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify main-ru is documentation-only
        shell: bash
        run: |
          git fetch origin main
          git diff --exit-code origin/main HEAD -- . ':(exclude,glob)**/*.md'
          git ls-tree -r --name-only origin/main | grep -E '\.md$' | sort > main-md.txt
          git ls-tree -r --name-only HEAD | grep -E '\.md$' | sort > ru-md.txt
          diff -u main-md.txt ru-md.txt
